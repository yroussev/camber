# MkDocs site config (docs-only; not a runtime dependency).
# Build:   pip install -e .[docs] && mkdocs build
# Serve:   mkdocs serve
# Publish: enable GitHub Pages for the repo, then `mkdocs gh-deploy` (or a Pages workflow).
site_name: CAMBER
site_description: Vendor-neutral building-automation-system trend analysis — FDD, M&V, RCx.
repo_url: https://github.com/yroussev/camber
docs_dir: docs
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: Dark }
    - scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: Light }
  features: [navigation.sections, navigation.top, content.code.copy]
nav:
  - Home: index.md
  - Capabilities: CAPABILITIES.md
  - Architecture: ARCHITECTURE.md
  - Ecosystem: ECOSYSTEM.md
  - Analytics:
      - Packaged / DX FDD: FDD-DX.md
      - Refrigerant properties: REFRIGERANT.md  # 093-refrig
      - Chiller drift & calibration: CHILLER-DRIFT.md
      - Pump / hydronic drift: PUMP-DRIFT.md
      - "Plant detectors: boiler, tower, bypass": PLANT-DETECTORS.md  # 092-plant
      - AHU / air-side drift: AHU-DRIFT.md
      - VAV / zone-terminal drift: VAV-DRIFT.md
      - Trim-and-Respond / G36 reset: TR-RESET.md
      - M&V: MANDV.md
      - Energy units (IP / SI): UNITS.md
      - Energy conversion factor tables: ENERGY-FACTORS.md
      - "M&V: Option D (calibrated sim)": OPTION-D.md
      - Weather fetch (NASA POWER + NOAA/ISD): WEATHER.md
      - Sensor health & data trust: SENSOR-HEALTH.md
      - Streaming / online: STREAMING.md
      - Forecasting: FORECAST.md
      - Grid-interactive (GEB): GEB.md
      - Carbon: CARBON.md
      - Ventilation: VENTILATION.md
      - Free-cooling / economizer: FREECOOLING.md
      - Operational change-point: CHANGEDETECT.md
      - Anomaly ensemble: ANOMALY.md
      - Load disaggregation: DISAGGREGATE.md
      - Schedule inference: SCHEDULE.md
      - Visualization: VISUALIZATION.md
  - Advisory & reporting:
      - Advisory optimization (ASO): ASO.md
      - Prioritized action plan: ACTIONPLAN.md
      - Building health scorecard: SCORECARD.md
      - Site report: SITE-REPORT.md
      - RCx report: RCX-REPORT.md
      - "References: PNNL Re-tuning": REFERENCES.md  # 096-report (#78)
  # 0.97 (#79-#83): the PNNL re-tuning workbook. Content branches add their pages ONLY between
  # their own BEGIN/END markers below (see docs/workbook/index.md).
  - Re-tuning workbook:
      - Overview and curriculum map: workbook/index.md
      # BEGIN workbook-air (#80)
      - "Air side: economizer and a stuck OA damper": workbook/air-economizer.md
      # END workbook-air (#80)
      #
      # BEGIN workbook-zone (#81)
      # END workbook-zone (#81)
      #
      # BEGIN workbook-plant (#82)
      # END workbook-plant (#82)
      #
      # BEGIN workbook-practice (#83)
      # END workbook-practice (#83)
      - Instructor guide: workbook/instructor.md
  - AI-assist:
      - Assisted point mapping: MAPPING-ASSIST.md
      - Grounded explanation & Q&A: AGENT.md
  - Platform:
      - CLI: CLI.md
      - Open datasets: DATASETS.md
      - Portfolio lifecycle: PORTFOLIO.md
      - Time handling & DST: TIME-HANDLING.md
      - Ingest protocols: INGEST-PROTOCOLS.md
      - Ingest formats: INGEST-FORMATS.md
      - Ontology / interop: ONTOLOGY.md
      - Served-by topology: TOPOLOGY.md
      - Integrations: INTEGRATIONS.md
      - Plugins: PLUGINS.md
      - Fault lifecycle: FAULT-LIFECYCLE.md
      - Scale: SCALE.md
      - Deployment: DEPLOY.md
      - Edge → cloud deployment: EDGE-DEPLOY.md
      - Security: SECURITY.md
      - Validation: VALIDATION.md
      - API stability & deprecation: API-STABILITY.md
# Internal working docs (historical release plans + design proposals) stay in the repo for
# contributors but are not part of the published site.
exclude_docs: |
  dev/
  proposals/
  workbook/_template.md
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
