[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camber-toolkit"   # PyPI distribution name (the bare "camber" is squatted); imports as `camber`
version = "0.66.0"
description = "Vendor-neutral building-automation-system trend analysis: FDD, M&V, and retro-commissioning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "The CAMBER authors" }]
keywords = [
  "BAS", "HVAC", "FDD", "fault detection",
  "measurement and verification", "retro-commissioning",
  "ASHRAE", "energy", "EMIS",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "matplotlib>=3.7",
  "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.8"]
# Docs site only (never a runtime dep): build the MkDocs site with `mkdocs build`.
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5"]
brick = ["rdflib>=6"]   # robust Brick/RDF parsing (camber.interop.brick backend="rdflib")
# a maintained Haystack client to wire via camber.ingest.haystack.client_transport;
# phable is modern but needs Python >= 3.11, pyhaystack covers older Pythons.
haystack = [
    "phable>=0.1.0; python_version >= '3.11'",
    "pyhaystack; python_version < '3.11'",
]
# full-fidelity URDB tariff billing via NREL PySAM's UtilityRate5 (BSD-3-Clause; large
# binary wheel). The native camber.tariff engine needs none of this; the bridge in
# camber.interop.tariff_nrel uses it for exotic rates / cross-checking.
tariff = ["nrel-pysam>=4"]
# LBNL BETTER analytical engine, to cross-validate CAMBER's change-point M&V and reach
# BETTER's benchmarking/targeting (modified BSD + U.S. DOE clauses). camber.interop.better
# imports it lazily; the core needs none of it.
better = ["better-lbnl-os"]
# Exact ASHRAE-formulation psychrometrics (dew point, humidity ratio, enthalpy) and a
# cross-check for CAMBER's dependency-free Stull wet-bulb. MIT. camber.interop.psychro
# imports it lazily; the core needs none of it.
psychro = ["psychrolib>=2"]
# Reference open-source PV modeling: irradiance transposition (GHI/DNI/DHI -> plane-of-array)
# and temperature-aware PVWatts yield, beyond camber.pv's flat-PR monitoring. BSD-3.
# camber.interop.pvlib_bridge imports it lazily; the core needs none of it.
pv = ["pvlib>=0.10"]
# Read-only network ingest adapters (camber.ingest.*). Each imports its protocol library
# lazily and never issues a write/command service. See docs/INGEST-PROTOCOLS.md + SECURITY.md.
# Modbus TCP register polling (pymodbus, BSD-3-Clause).
modbus = ["pymodbus>=3"]
# MQTT / Sparkplug streaming telemetry (paho-mqtt; depend under its EDL-1.0 / BSD-style option).
mqtt = ["paho-mqtt>=1.6"]
# BACnet property / Trend-Log reads incl. experimental BACnet/SC (bacpypes3, MIT). SC needs an
# operational certificate + hub URI; prefer a historian/gateway for production BACnet.
bacnet = ["bacpypes3>=0.0.98"]
# Vendor proprietary-property typed decoding + role-mapping hints via ace-bacnet-devices (MIT): a
# static catalog of PICS-extracted extensions. Optional bridge in camber.interop.bacnet_vendor; the
# BACnet discovery + role-mapping core needs none of it.
bacnet-vendor = ["ace-bacnet-devices>=0.2"]
# OPC-UA value/history reads (asyncua / opcua-asyncio). NOTE: asyncua is LGPL-3.0 -- kept as an
# optional, dynamically-imported dependency only (never vendored/bundled). camber.ingest.opcua
# imports it lazily; the core needs none of it.
opcua = ["asyncua>=1.0"]
# Optional learned point-mapping backend (camber.mapping_assist.MLSuggester). scikit-learn (BSD-3).
# Trains on the caller's / synthetic labels; ships NO pretrained weights. camber.mapping_assist
# imports it lazily behind _require(); the numpy FeatureSuggester baseline needs none of it.
ml = ["scikit-learn>=1.3"]
# One-way edge→cloud forwarder (camber.edge). The DEFAULT path — read-only ingest, quality-gate,
# Parquet spool, and the presigned-HTTPS PresignedHttpsSink — needs NO new deps (stdlib urllib/ssl +
# core pyarrow), so `edge` is an empty marker. The SDK sinks (for sites that mandate direct scoped
# credentials) are the only ones pulling libraries, each lazily imported. See docs/EDGE-DEPLOY.md.
edge = []
edge-s3 = ["boto3>=1.34"]
edge-azure = ["azure-storage-blob>=12"]
edge-gcs = ["google-cloud-storage>=2"]

[project.scripts]
camber = "camber.cli:main"

[tool.setuptools.packages.find]
include = ["camber*"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so downstream mypy trusts CAMBER's inline type hints.
camber = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Moderate, high-value rule set: pyflakes (F), import sorting (I), pycodestyle
# errors/warnings (E/W), pyupgrade (UP), and flake8-bugbear (B). Ratchet upward in
# later hardening releases.
select = ["E", "F", "I", "W", "UP", "B"]
# B905 (zip-without-explicit-strict) intentionally deferred: mechanically adding
# strict=False would just opt out of the safety, and a correct strict=True audit is a
# focused per-call-site task for a later release.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Every test/example module runs a `sys.path.insert(...)` prelude before importing
# `camber`, so imports legitimately follow executable code.
"tests/*" = ["E402"]
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["camber"]
# Pragmatic floor for the 0.9.x hardening series: the optional-extra libraries (and the
# heavy numeric stack) are import-ignored, and untyped function bodies aren't deep-checked
# yet. This gates the declared type surface and ratchets up in later releases.
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["camber"]
branch = true
omit = ["camber/store/bench.py"]  # a perf/benchmark harness, not product logic

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",  # Protocol / overload stub bodies
]
