name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,brick]

      - name: Type check (mypy)
        run: mypy

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,brick]

      - name: Coverage gate (fails under the floor)
        run: pytest --cov=camber --cov-branch --cov-report=term-missing --cov-fail-under=90

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Default legs install the newest numpy the pin allows (2.x) across every supported Python.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        numpy: [""]
        include:
          # Pin the numpy floor on one leg so the lower bound (numpy 1.x) stays proven, not just 2.x.
          - python-version: "3.11"
            numpy: ">=1.24,<2"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,brick]   # brick extra so the rdflib backend is tested

      - name: Pin numpy ${{ matrix.numpy }}
        if: matrix.numpy != ''
        run: pip install "numpy${{ matrix.numpy }}"

      - name: Test
        run: pytest -q
