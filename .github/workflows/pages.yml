name: Docs (GitHub Pages)

# Build the MkDocs site and publish it to GitHub Pages. Docs-only: the [docs] extra is never a
# runtime dependency.

# Pages is enabled for this repo and the first deploy is green, so the push trigger is armed:
# docs changes on main publish automatically. workflow_dispatch stays for manual re-publishes.
#
# On a fork, enable Pages first -- `configure-pages` with `enablement: true` is often refused for the
# workflow's GITHUB_TOKEN ("Resource not accessible by integration"). See docs/DEPLOY.md.
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

# deny-by-default; jobs opt into exactly what they need
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write          # configure-pages enablement writes the Pages config
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Build site
        # not --strict: the docs intentionally link to repo files outside the docs/ tree
        # (../camber/*.py, ../ROADMAP.md, ../deploy/*) which resolve on GitHub but not in the site.
        run: python -m mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
