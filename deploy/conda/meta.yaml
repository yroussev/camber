# conda-forge recipe for camber-toolkit (noarch: python). Submit via conda-forge/staged-recipes to
# create the feedstock; pinned to the published {{ version }} sdist with its sha256. See docs/DEPLOY.md.
{% set name = "camber-toolkit" %}
{% set version = "0.12.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  # sha256 of the published sdist; get it with:
  #   curl -sL https://pypi.org/pypi/{{ name }}/{{ version }}/json | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256'
  sha256: d5d7c1bd4982fab53279a0978d0288aebe68dd4652f579cec509a318b1fb3290

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - camber = camber.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=64
  run:
    - python >=3.10
    - numpy >=1.24,<3
    - pandas >=2.0,<3
    - matplotlib-base >=3.7
    - pyarrow >=14
  run_constrained:
    # optional [ml] extra — the learned point-mapping backend (camber.mapping_assist.MLSuggester)
    - scikit-learn >=1.3

test:
  imports:
    - camber
  commands:
    - camber --help

about:
  home: https://github.com/yroussev/camber
  license: Apache-2.0
  license_file: LICENSE
  summary: Vendor-neutral building-automation-system trend analysis (FDD, M&V, RCx)

extra:
  recipe-maintainers:
    - yroussev
