# conda-forge recipe for camber-toolkit (v1 recipe.yaml / rattler-build). A MIRROR of
# conda-forge/camber-toolkit-feedstock's recipe/recipe.yaml, which is the source of truth since the
# feedstock went live (2026-09-24). New versions land there as regro-cf-autotick-bot PRs after each
# PyPI release; after merging one, copy the version + sha256 here so the two don't drift:
#   curl -sL https://pypi.org/pypi/camber-toolkit/<version>/json \
#     | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256'
# See docs/DEPLOY.md and RELEASING.md.
context:
  name: camber-toolkit
  version: "0.81.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name|replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 36dcb3b80d7311ae0b399ebacffa7b70f9b6c41fe9d3690425ff137d58e83c28

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - camber = camber.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - numpy >=1.24,<3
    - pandas >=2.0,<3
    - matplotlib-base >=3.7
    - pyarrow >=14

tests:
  - python:
      imports:
        - camber
        - camber.mandv
        - camber.rules
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - camber --help

about:
  homepage: https://github.com/yroussev/camber
  repository: https://github.com/yroussev/camber
  documentation: https://yroussev.github.io/camber/
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  summary: Vendor-neutral building-automation-system trend analysis (FDD, M&V, RCx)
  description: |
    CAMBER is a dependency-light, vendor-neutral toolkit for building-automation-system (BAS)
    trend analysis: fault detection & diagnostics (ASHRAE G36 / PNNL Re-tuning), measurement &
    verification (IPMVP A/B/C/D), and retro-commissioning, all speaking a common Role vocabulary.

extra:
  recipe-maintainers:
    - yroussev
